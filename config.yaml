receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4137"
      http:
        endpoint: "[::]:4318"

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
