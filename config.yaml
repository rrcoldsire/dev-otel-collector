receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4137"
      http:
        endpoint: "[::]:4318"

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed
  otlphttp/openobserve:
    endpoint: ${env:OTLP_EXPORTER_OO_ENDPOINT}
    headers:
      authorization: ${env:OTLP_EXPORTER_OO_AUTH}
      stream-name: default

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/openobserve]
